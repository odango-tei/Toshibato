const ghPacks=new Map(),ghPending=new Map();
window.GH_DIAGNOSTICS={build:GH_BUILD,stage:'manifest',source:location.origin+location.pathname};
window.GAS2_BOOT={errors:[],fail(e){this.errors.push(String(e.message||e))}};
window.GAS2_SPLIT={blobs:new Map(),pending:new Map(),queue:new Set(),active:0,requests:[],errors:[],coreReady:false};
const ghB64=bytes=>{let s='';for(let i=0;i<bytes.length;i+=16384)s+=String.fromCharCode(...bytes.subarray(i,i+16384));return btoa(s)};
async function ghPack(file){
 const hit=ghPacks.get(file);if(hit){ghPacks.delete(file);ghPacks.set(file,hit);return hit}
 if(ghPending.has(file))return ghPending.get(file);
 const task=(async()=>{const meta=ghManifest.packs[file];if(!meta)throw Error('未登録のファイル: '+file);
 const r=await fetch(file);if(!r.ok)throw Error('読み込めません: '+file+' / HTTP '+r.status);
 const body=new Uint8Array(await r.arrayBuffer());if(body.length!==meta.bytes||!ghFrame.every((v,i)=>body[i]===v))throw Error('データ形式か長さが異なります: '+file);
 if(globalThis.crypto?.subtle){const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',body)),v=>v.toString(16).padStart(2,'0')).join('');if(digest!==meta.sha256)throw Error('データの照合に失敗しました: '+file)}
 ghPacks.set(file,body);while(ghPacks.size>2)ghPacks.delete(ghPacks.keys().next().value);return body})();
 ghPending.set(file,task);try{return await task}finally{ghPending.delete(file)}
}
async function ghBytes(name){const m=ghManifest.entries[name];if(!m)throw Error('未登録のデータ: '+name);const body=await ghPack(m.file);if(m.offset<ghFrame.length||m.offset+m.bytes>body.length)throw Error('データ範囲が不正です: '+name);const bytes=body.subarray(m.offset,m.offset+m.bytes);if(bytes[0]!==31||bytes[1]!==139||bytes[2]!==8)throw Error('圧縮データが不正です: '+name+' / '+m.file);return bytes}
async function gas2AssetRequest(kind,keys){GAS2_SPLIT.requests.push({kind,keys});if(kind!=='pages')throw Error('Unexpected asset kind');const values=await Promise.all(keys.map(async k=>[k,ghB64(await ghBytes('p-'+k))]));return{pages:Object.fromEntries(values)}}
function gas2PageBlob(key){const s=GAS2_SPLIT,k=String(key),v=s.blobs.get(k);if(v){s.blobs.delete(k);s.blobs.set(k,v)}return v}
function gas2LoadPage(key){const s=GAS2_SPLIT,k=String(key);if(s.blobs.has(k))return Promise.resolve();if(s.pending.has(k))return s.pending.get(k).promise;let resolve,reject;const promise=new Promise((a,b)=>{resolve=a;reject=b});s.pending.set(k,{promise,resolve,reject});s.queue.add(k);setTimeout(gas2PumpPages,0);return promise}
function gas2PumpPages(){const s=GAS2_SPLIT;while(s.active<2&&s.queue.size){const keys=[...s.queue].slice(0,8);keys.forEach(k=>s.queue.delete(k));s.active++;gas2AssetRequest('pages',keys.map(Number)).then(r=>{for(const k of keys){s.blobs.set(k,r.pages[k]);s.pending.get(k).resolve();s.pending.delete(k)}while(s.blobs.size>24)s.blobs.delete(s.blobs.keys().next().value);window.gas2RefreshThumbs?.()}).catch(e=>{s.errors.push(e.message);for(const k of keys){s.pending.get(k)?.reject(e);s.pending.delete(k)}window.gas2ThumbFailure?.(keys)}).finally(()=>{s.active--;gas2PumpPages()})}}
function ghBootFailure(e){GAS2_BOOT.fail(e);const panel=document.createElement('section');panel.style.cssText='position:fixed;inset:20px;z-index:999999;background:#fff4dc;color:#702b20;padding:24px;overflow:auto';const title=document.createElement('h2');title.textContent='起動できませんでした';const detail=document.createElement('pre');detail.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;font:inherit';detail.textContent=String(e.message||e)+'\n\nビルド: '+GH_BUILD+'\n段階: '+GH_DIAGNOSTICS.stage+'\n場所: '+GH_DIAGNOSTICS.source;panel.append(title,detail);document.body.appendChild(panel)}
(async()=>{try{
 if(location.protocol==='file:')throw Error('GitHub PagesまたはHTTPプレビューから開いてください');
 ghManifest=JSON.parse(document.getElementById('gh-manifest').textContent);if(ghManifest.version!==GH_BUILD)throw Error('起動ファイルとデータの版が異なります');GH_DIAGNOSTICS.stage='core pack';
 const [app,index,extras,...codes]=await Promise.all(['app','index','extras',...ghManifest.codes].map(ghBytes));
 const html=fflate.strFromU8(fflate.gunzipSync(app)),doc=new DOMParser().parseFromString(html,'text/html');
 ghManifest.codes.forEach((id,i)=>{doc.getElementById(id).textContent=JSON.stringify(ghB64(codes[i]))});
 const scripts=[];for(const e of [...doc.querySelectorAll('script')]){if(e.type==='application/json')continue;if(['gas2-startup','gas2-inflater'].includes(e.id)){e.remove();continue}scripts.push(e.textContent);e.remove()}
 const el=document.createElement('script');el.id='gas2-town-index';el.type='application/json';el.textContent=JSON.stringify(ghB64(index));document.head.appendChild(el);
 for(const e of [...doc.head.children])if(!['TITLE','META'].includes(e.tagName))document.head.appendChild(document.importNode(e,true));
 document.getElementById('boot-style')?.remove();document.body.innerHTML=doc.body.innerHTML;GH_DIAGNOSTICS.stage='game scripts';
 for(const code of [...scripts,fflate.strFromU8(fflate.gunzipSync(extras))]){const s=document.createElement('script');s.textContent=code;document.body.appendChild(s);s.remove();if(GAS2_BOOT.errors.length)throw Error(GAS2_BOOT.errors.at(-1))}
 if(!GAS2_APP_READY||!window.GH_OFFLINE)throw Error('初期化に失敗しました');ghPacks.delete('game.bin');GAS2_SPLIT.coreReady=true;window.GH_READY=true;GH_DIAGNOSTICS.stage='ready';gas2RefreshThumbs();
 }catch(e){ghBootFailure(e)}})();
</script></body></html>
